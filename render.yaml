# Render Blueprint: one public web service = the Livecraft game at /, the API at /v1, WebSockets at /v1/ws and the
# dashboard at /dashboard. Deploy: https://render.com/deploy?repo=https://github.com/githuphub/Reactive
# Secrets are never committed: paste ANTHROPIC_API_KEY (and optionally OPENAI_API_KEY) in the Render dashboard.
# The admin key is generated by Render (Dashboard > your service > Environment > LIVEFORGE_ADMIN_KEY).
# The free plan has no persistent disk: the SQLite file (player memories, rumours, spend counters) starts empty on
# every deploy and every cold start after idle.
services:
  - type: web
    name: reactive
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVEFORGE_DEV
        value: "0"
      - key: LIVEFORGE_MANIFESTS
        value: examples/livecraft.liveforge.yaml
      - key: LIVEFORGE_STATIC_DIR
        value: /app/examples/livecraft/dist
      # game=key; must match the key baked into the Livecraft build (Dockerfile ARG VITE_LIVEFORGE_KEY)
      - key: LIVEFORGE_SDK_KEYS
        value: livecraft=pk_live_livecraft
      - key: LIVEFORGE_ADMIN_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEFORGE_RATE_LIMIT_PER_MIN
        value: "120"
      - key: LIVEFORGE_CORS_ORIGINS
        value: "*"
      # Render's proxy sets X-Forwarded-For: rate limits are per player IP, not per (shared) publishable key
      - key: LIVEFORGE_TRUST_PROXY
        value: "1"
      - key: LIVEFORGE_STT_PER_MIN
        value: "6"
      - key: LIVEFORGE_STT_PER_DAY
        value: "500"
      - key: LIVEFORGE_STT_MAX_BYTES
        value: "3000000"
